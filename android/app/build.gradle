plugins {
    id 'com.android.application'
}

// URL base por defecto del backend (servidor/public/index.php): vale para el
// emulador con Apache en el puerto 80. Con un móvil físico cada uno escribe en
// el campo "Servidor" del login la IP de SU PC (p. ej. http://192.168.0.200)
// y la app la recuerda; no hace falta recompilar.
// Con el servidor PHP integrado (php -S ...:8080) sería http://10.0.2.2:8080.
def apiBase = "http://10.0.2.2"

android {
    namespace 'com.grupo1.biometria'
    compileSdk 36

    defaultConfig {
        applicationId "com.grupo1.biometria"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "API_BASE", "\"${apiBase}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // H16: mapa base OpenStreetMap (osmdroid) para la pantalla principal.
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    // org.json real para los tests JVM (en el móvil lo aporta el framework).
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
